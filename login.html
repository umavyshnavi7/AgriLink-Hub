<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AgriLink Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #e2f0da 0%, #c8e0c0 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    body::before { content: '🌹'; position: absolute; font-size: 8rem; opacity: 0.1; top: 10%; left: 10%; animation: float 6s ease-in-out infinite; }
    body::after { content: '🌺'; position: absolute; font-size: 7rem; opacity: 0.1; bottom: 10%; right: 10%; animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
    .login-container { background: white; padding: 3rem; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,40,0,0.15); width: 100%; max-width: 420px; position: relative; z-index: 1; }
    .login-container::before { content: '🌷'; position: absolute; top: -15px; right: 20px; font-size: 2.5rem; }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo i { font-size: 3rem; color: #1f4f2b; }
    h2 { font-family: 'Merriweather', serif; color: #1f4f2b; text-align: center; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: #2e3b2e; font-weight: 500; }
    input { width: 100%; padding: 0.8rem; border: 2px solid #deecce; border-radius: 12px; font-size: 1rem; transition: border 0.3s; }
    input:focus { outline: none; border-color: #1f4f2b; box-shadow: 0 0 0 3px rgba(31,79,43,0.1); }
    .btn { width: 100%; background: linear-gradient(135deg, #e9b741 0%, #dda52d 100%); color: #1f4f2b; padding: 1rem; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(233,183,65,0.3); }
    .links { text-align: center; margin-top: 1.5rem; }
    .links a { color: #1f4f2b; text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
    .captcha-box { background: #f9f7eb; border: 2px solid #deecce; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.8rem; overflow: hidden; }
    .captcha-canvas { border-radius: 8px; background: #1f4f2b; letter-spacing: 3px; font-size: 1.1rem; font-weight: 700; color: white; padding: 0.4rem 0.7rem; font-family: 'Courier New', monospace; user-select: none; flex-shrink: 0; white-space: nowrap; }
    .captcha-input { flex: 1; min-width: 0; width: auto !important; padding: 0.5rem; border: 2px solid #deecce; border-radius: 8px; font-size: 0.95rem; text-align: center; }
    .captcha-refresh { background: none; border: none; cursor: pointer; color: #1f4f2b; font-size: 1.1rem; flex-shrink: 0; padding: 0; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo"><i class="fas fa-seedling"></i></div>
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-group">
        <label>Verify you're human</label>
        <div class="captcha-box">
          <span class="captcha-canvas" id="captchaQuestion"></span>
          <input type="text" class="captcha-input" id="captchaAnswer" placeholder="Enter letters" required autocomplete="off">
          <button type="button" class="captcha-refresh" onclick="generateCaptcha()" title="Refresh"><i class="fas fa-sync-alt"></i></button>
        </div>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <div class="links">
      <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
      <p><a href="far.html">Back to Home</a></p>
    </div>
  </div>
  <script src="api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);

    let captchaResult = '';
    function generateCaptcha() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      captchaResult = Array.from({length: 6}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
      document.getElementById('captchaQuestion').textContent = captchaResult;
      document.getElementById('captchaAnswer').value = '';
    }
    generateCaptcha();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');

      const captchaAnswer = document.getElementById('captchaAnswer').value.toUpperCase();
      if (captchaAnswer !== captchaResult) {
        showToast('Incorrect CAPTCHA! Please try again.', 'error');
        generateCaptcha();
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      setLoading(btn, true);
      try {
        const data = await AuthService.login(email, password);
        AuthService.setSession(data);
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = AuthService.getDashboard(data.role), 1200);
      } catch (err) {
        showToast(err.message, 'error');
        generateCaptcha();
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
